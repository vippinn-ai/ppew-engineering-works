# Builds the Next.js static export and publishes it to GitHub Pages.
#
# A Pages *project* site is served from https://<user>.github.io/<repo>/, not
# from a domain root, so the build needs NEXT_PUBLIC_BASE_PATH. Without it the
# framework and product-image paths resolve against the wrong root and the page
# renders unstyled with no images.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it midway.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: source
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: source/package-lock.json

      - run: npm ci

      - run: npx next build
        env:
          NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}
          # Production is Cloudflare Pages on ppengineeringworks.com. This copy
          # is the same content on a different URL, so it stays out of search
          # results rather than competing with the real domain.
          NEXT_PUBLIC_NOINDEX: "1"

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: source/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
